<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaziConnect Rwanda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.22.0"
  }
}
</script>
    <script type="module" src="/index.js"></script>
    <style>
        /* CSS Variables for theming */
        :root {
            --background-light: #F7F9FC;
            --background-dark: #111827;
            --card-bg-light: #FFFFFF;
            --card-bg-dark: #1F2937;
            --glass-bg-light: rgba(255, 255, 255, 0.6);
            --glass-bg-dark: rgba(31, 41, 55, 0.6);
            --text-primary-light: #111827;
            --text-primary-dark: #F9FAFB;
            --text-secondary-light: #4B5563;
            --text-secondary-dark: #9CA3AF;
            --border-light: #E5E7EB;
            --border-dark: #374151;
            --brand-primary: #0077b6;
            --brand-secondary: #00b4d8;
            --brand-accent: #ade8f4;
            --shadow-color: 220 3% 15%;
            --shadow-elevation-low:
                0.3px 0.5px 0.7px hsl(var(--shadow-color) / 0.34),
                0.4px 0.8px 1px -1.2px hsl(var(--shadow-color) / 0.34),
                1px 2px 2.5px -2.5px hsl(var(--shadow-color) / 0.34);
            --shadow-elevation-medium:
                0.3px 0.5px 0.7px hsl(var(--shadow-color) / 0.36),
                0.8px 1.6px 2px -0.8px hsl(var(--shadow-color) / 0.36),
                2.1px 4.1px 5.2px -1.7px hsl(var(--shadow-color) / 0.36),
                5px 10px 12.6px -2.5px hsl(var(--shadow-color) / 0.36);
        }
        
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-display {
            font-family: 'Poppins', sans-serif;
        }
        
        .main-app-bg {
             background-color: var(--background-light);
             background-image:
                linear-gradient(to right, rgba(237, 242, 247, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(237, 242, 247, 0.5) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        .dark .main-app-bg {
             background-color: var(--background-dark);
             background-image:
                linear-gradient(to right, rgba(31, 41, 55, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(31, 41, 55, 0.5) 1px, transparent 1px);
            background-size: 24px 24px;
        }


        /* Animated Gradient Background */
        .animated-gradient-bg {
            background: linear-gradient(-45deg, #023e8a, #0077b6, #00b4d8, #90e0ef);
            background-size: 400% 400%;
            animation: gradient 20s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
            border: transparent;
        }
        .dark ::-webkit-scrollbar-thumb {
             background-color: rgba(75, 85, 99, 0.5);
        }

        /* Ripple effect for buttons */
        .ripple-button {
            position: relative;
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            background-color: rgba(255, 255, 255, 0.7);
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        /* Fade-in animation */
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out both;
        }
        
        .animate-fade-in-down {
            animation: fadeInDown 0.8s ease-out both;
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scale-in animation for confirmation icons */
        @keyframes scaleIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in {
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* Notification animation */
        .animate-notification-in {
            animation: notificationIn 0.5s ease-out forwards;
        }
        
        @keyframes notificationIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .card {
            background-color: var(--card-bg-light);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-elevation-low);
            transition: all 0.3s cubic-bezier(.25,.8,.25,1);
        }
        .dark .card {
             background-color: var(--card-bg-dark);
             border: 1px solid var(--border-dark);
        }
        .card:hover {
            box-shadow: var(--shadow-elevation-medium);
            transform: translateY(-4px);
        }
        
        .glass-card {
            background-color: var(--glass-bg-light);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .dark .glass-card {
            background-color: var(--glass-bg-dark);
        }

    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
